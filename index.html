<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface do Bingão</title>
    <style>

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0f111a; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #1a1d29; 
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #ff79c633; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 121, 198, 0.05);
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid #34495e;
            padding-bottom: 15px;
            margin-top: 0;
        }

        .bola-sorteada {
            font-family: 'Courier New', Courier, monospace; 
            font-size: 72px;
            font-weight: bold;
            color: #ff79c6; 
            background-color: #121420;
            width: 140px;
            height: 140px;
            line-height: 135px;
            border-radius: 8px; 
            margin: 25px auto;
            border: 2px solid #ff79c6;
            box-shadow: 0 0 15px rgba(255, 121, 198, 0.2);
            text-shadow: 0 0 10px rgba(255, 121, 198, 0.5);
        }

        .menu-botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        button {
            padding: 14px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-sortear {
            grid-column: span 2;
            background-color: transparent;
            color: #d64380;
            border: 1px solid #ff79a6;
        }
        .btn-sortear:hover { 
            background-color: #ff79c6; 
            color: #121420;
            box-shadow: 0 0 15px rgba(255, 121, 198, 0.4);
        }

        .btn-acao { 
            background-color: #212636; 
            color: #8be9fd; 
            border: 1px solid #282a36;
        }
        .btn-acao:hover { 
            background-color: transparent;
            border-color: #8be9fd;
            box-shadow: 0 0 10px rgba(139, 233, 253, 0.2);
        }

        .btn-sair { 
            background-color: #212636; 
            color: #ff5555; 
            border: 1px solid #282a36;
        }
        .btn-sair:hover { 
            border-color: #ff5555;
            background-color: rgba(255, 85, 85, 0.1);
        }

        .painel-grade {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            margin-bottom: 25px;
            background-color: #121420;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #212636;
        }

        .bola-item {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            font-weight: bold;
            color: #44475a; /* Cor apagada inicial */
            background-color: #1a1d29;
            padding: 6px 0;
            border-radius: 4px;
            border: 1px solid #212636;
            transition: all 0.3s ease;
        }


        .bola-item.sorteada {
            color: #121420;
            background-color: #f1304a;
            border-color: #f72d59;
            box-shadow: 0 0 8px rgba(255, 121, 198, 0.5);
        }

        .painel-exibicao {
            background-color: #121420;
            border: 1px solid #212636;
            padding: 20px;
            border-radius: 6px;
            min-height: 60px;
            text-align: left;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #f8f8f2;
        }

        .titulo-painel {
            font-weight: bold;
            color: #ccd2e4;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SISTEMA BINGAO</h1>
        
        <div class="bola-sorteada" id="visorBola">--</div>
        
        <div class="menu-botoes">
            <button class="btn-sortear" onclick="sortearNumero()">1 - Sortear numero</button>
            <button class="btn-acao" onclick="exibirSorteados()">2 - Sorteados</button>
            <button class="btn-acao" onclick="exibirRestantes()">3 - Restantes</button>
            <button class="btn-sair" onclick="sairDoJogo()">4 - Sair / Reset</button>
        </div>

        <div class="painel-grade" id="painelGrade">
            </div>

        <div class="painel-exibicao">
            <div class="titulo-painel" id="tituloPainel">STATUS DO SISTEMA:</div>
            <div id="conteudoPainel">Pronto para iniciar o sorteio de dados.</div>
        </div>
    </div>

    <script>
        let numerosSorteados = [];
        const TOTAL_NUMEROS = 75;
        let globo = [];

        // Inicializa o vetor do globo estruturado
        function inicializarGlobo() {
            globo = [];
            for (let i = 1; i <= TOTAL_NUMEROS; i++) {
                globo.push(i);
            }
        }

        // NOVO: Função para renderizar visualmente a grade de 75 números vazia
        function gerarGradeVisual() {
            const grade = document.getElementById("painelGrade");
            grade.innerHTML = ""; // Limpa a grade anterior
            
            for (let i = 1; i <= TOTAL_NUMEROS; i++) {
                const elementoBola = document.createElement("div");
                elementoBola.classList.add("bola-item");
                elementoBola.id = `b-${i}`; // ID exclusivo para mapear cada número
                elementoBola.innerText = i < 10 ? "0" + i : i;
                grade.appendChild(elementoBola);
            }
        }

        // Execução primária do sistema
        inicializarGlobo();
        gerarGradeVisual();

        function sortearNumero() {
            const visor = document.getElementById("visorBola");
            const titulo = document.getElementById("tituloPainel");
            const conteudo = document.getElementById("conteudoPainel");

            if (globo.length === 0) {
                visor.innerText = "END";
                titulo.innerText = "STATUS:";
                conteudo.innerText = "Todos os numeros disponiveis ja foram processados.";
                return;
            }

            let indice = Math.floor(Math.random() * globo.length);
            let numero = globo.splice(indice, 1)[0];
            numerosSorteados.push(numero);

            // 1. Atualiza o visor principal
            visor.innerText = numero < 10 ? "0" + numero : numero;
            
            // 2. NOVO: Localiza o número sorteado na grade e altera sua cor aplicando a classe CSS
            const bolaGrade = document.getElementById(`b-${numero}`);
            if (bolaGrade) {
                bolaGrade.classList.add("sorteada");
            }
            
            titulo.innerText = "ULTIMO SORTEIO:";
            conteudo.innerText = `O número ${numero} foi sorteado. Restam ${globo.length} números no globo.`;
        }

        function exibirSorteados() {
            const titulo = document.getElementById("tituloPainel");
            const conteudo = document.getElementById("conteudoPainel");

            titulo.innerText = "NUMEROS EXTRAIDOS (ORDENADOS):";

            if (numerosSorteados.length === 0) {
                conteudo.innerText = "Nenhum registro encontrado no historico.";
            } else {
                let copia = [...numerosSorteados];
                copia.sort((a, b) => a - b);
                conteudo.innerText = copia.join(" - ");
            }
        }

        function exibirRestantes() {
            const titulo = document.getElementById("tituloPainel");
            const conteudo = document.getElementById("conteudoPainel");

            titulo.innerText = "VETOR DE DISPONIVEIS:";

            if (globo.length === 0) {
                conteudo.innerText = "Vetor vazio. Nao ha mais dados.";
            } else {
                conteudo.innerText = globo.join(" - ");
            }
        }

        function sairDoJogo() {
            alert("Obrigado por utilizar o Bingão! O sistema será reiniciado.");
            
            numerosSorteados = [];
            inicializarGlobo();
            gerarGradeVisual(); // NOVO: Reconstrói o painel resetando todas as cores de volta ao cinza
            
            document.getElementById("visorBola").innerText = "--";
            document.getElementById("tituloPainel").innerText = "SISTEMA REINICIADO";
            document.getElementById("conteudoPainel").innerText = "Todos os dados e o painel geral foram limpos. Pronto para nova carga.";
        }
    </script>
</body>
</html>
